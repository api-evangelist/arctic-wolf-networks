apis:
- name: Aurora Multi-Tenant API
  description: >-
    RESTful API (v2.0.0) for Arctic Wolf partner applications managing multiple customer tenants —
    create a partner application, generate an OAuth client-credentials bearer token, run health checks,
    and issue tenant-scoped requests. Built on the Cylance endpoint platform Arctic Wolf operates.
  humanURL: https://docs.arcticwolf.com/en/developer-and-oem/aurora-multi-tenant-api/aurora-multi-tenant-api
  baseURL: https://api-admin.cylance.com/public/v2
  properties:
  - type: Documentation
    url: https://docs.arcticwolf.com/en/developer-and-oem/aurora-multi-tenant-api/aurora-multi-tenant-api
  - type: APIReference
    url: https://docs.arcticwolf.com/bundle/aurora_mtc_api/page/index.html
  - type: GettingStarted
    url: https://docs.arcticwolf.com/en/developer-and-oem/aurora-multi-tenant-api/aurora-multi-tenant-api/getting-started
- name: Aurora Endpoint Defense API
  description: >-
    RESTful API for organizations to manage Aurora Endpoint Security resources — Device API, User API,
    Global List API, Policy API, Zone API, Threat API, and Memory Protection API. Clients request an
    access token from the Auth endpoint, then call all other endpoints with the returned bearer token.
  humanURL: https://docs.arcticwolf.com/en/developer-and-oem/aurora-endpoint-defense-api/restful-api
  baseURL: https://api-admin.cylance.com/public/v2
  properties:
  - type: Documentation
    url: https://docs.arcticwolf.com/en/developer-and-oem/aurora-endpoint-defense-api/device-api
  - type: APIReference
    url: https://docs.arcticwolf.com/bundle/Aurora-User-API-guide/page/User_API.html
