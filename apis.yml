aid: arctic-wolf-networks
name: Arctic Wolf Networks
description: >-
  Arctic Wolf Networks is a security operations company delivering 24x7 AI-driven cybersecurity
  through its Aurora Platform, spanning Managed Detection and Response (MDR), Managed Risk, Managed
  Security Awareness, Incident Response, and Aurora Endpoint Security. For developers and OEM partners,
  Arctic Wolf publishes RESTful APIs on docs.arcticwolf.com — the Aurora Multi-Tenant API (2.0.0) for
  partners managing many customer tenants and the Aurora Endpoint Defense / User API for organizations
  managing devices, policies, zones, threats, and global lists. The APIs authenticate with an OAuth 2.0
  client-credentials grant that mints a bearer access token. Arctic Wolf publishes a public trust center
  (SOC 2, ISO 27001/27017/27018, PCI DSS, HIPAA, FedRAMP, GDPR, CSA STAR) and a coordinated vulnerability
  disclosure program via security.txt.
